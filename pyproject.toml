[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "gen-ai-locator-finder"
version = "0.1.0"
description = "AI-powered UI locator discovery and self-healing agent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "playwright>=1.49,<2",
  "chromadb>=0.5,<2",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "polars>=1.12,<2",
  "openpyxl>=3.1,<4",
  "matplotlib>=3.9,<4",
  "seaborn>=0.13,<1",
  "plotly>=5.24,<6",
  "scikit-learn>=1.5,<2",
  "scipy>=1.14,<2",
  "faker>=30,<40",
  "httpx>=0.27,<1",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
cloud = ["litellm>=1.55,<2", "google-genai>=1.0,<2"]
vector = ["pymilvus>=2.5,<3"]
ml = ["xgboost>=2.1,<3", "lightgbm>=4.5,<5", "torch>=2.5,<3", "tensorflow>=2.18,<3", "sentence-transformers>=3.3,<5", "transformers>=4.46,<5"]
frameworks = ["langchain>=0.3,<2", "langgraph>=0.2,<2", "guidance>=0.2,<1", "outlines>=0.0.46,<1", "crewai>=0.86,<1", "agno>=1.0,<2", "pydantic-ai>=0.0.19,<2", "google-adk>=0.1,<2", "semantic-kernel>=1.20,<2", "dspy>=2.5,<3", "mcp>=1.2,<2"]
telemetry = ["opentelemetry-api>=1.28,<2", "opentelemetry-sdk>=1.28,<2"]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1", "pytest-cov>=6,<7", "ruff>=0.8,<1", "mypy>=1.13,<2", "pre-commit>=4,<5", "types-requests>=2.32"]
all = ["gen-ai-locator-finder[cloud,vector,ml,frameworks,telemetry,dev]"]

[project.scripts]
locator-api = "app.main:run"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", ".data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "ASYNC"]
ignore = ["S101", "S106", "S110", "S112", "B008", "E501", "ASYNC109"]

[tool.ruff.lint.per-file-ignores]
"app/integrations/*.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
warn_unreachable = true
warn_unused_ignores = false
exclude = [".venv"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]

asyncio_default_fixture_loop_scope = "function"
